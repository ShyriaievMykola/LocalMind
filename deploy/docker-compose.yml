# Сервер бекапу LocalMind. Запуск з кореня репозиторію:
#   cp deploy/.env.example deploy/.env      # і впишіть свій ключ (див. коментар у файлі)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  server:
    build:
      context: ..
      dockerfile: src/LocalMind.Server/Dockerfile
    image: localmind-server
    restart: unless-stopped
    environment:
      # Обов'язковий: без ключа сервер не стартує, а compose не запускає контейнер.
      Jwt__SigningKey: ${LOCALMIND_JWT_KEY:?Задайте LOCALMIND_JWT_KEY у deploy/.env (див. deploy/.env.example)}
      # Початковий адміністратор (необов'язково): обидва поля або жодного. Створюється лише якщо такого email ще немає.
      Admin__Email: ${LOCALMIND_ADMIN_EMAIL:-}
      Admin__Password: ${LOCALMIND_ADMIN_PASSWORD:-}
      # Адреса reverse proxy в мережі Docker: лише від нього довіряємо X-Forwarded-For/Proto.
      ReverseProxy__KnownNetworks__0: ${LOCALMIND_PROXY_NETWORK:-172.16.0.0/12}
      # Дозволені імена хоста (Host); "*" — будь-які. localhost додається завжди: healthcheck стукає на нього,
      # і без цього при заданому домені контейнер вважався б нездоровим.
      AllowedHosts: "${LOCALMIND_ALLOWED_HOSTS:-*};localhost"
    ports:
      # Лише локальний інтерфейс: назовні сервер має дивитися через reverse proxy з HTTPS.
      - "127.0.0.1:${LOCALMIND_PORT:-8080}:8080"
    volumes:
      - localmind-db:/data/db
      - localmind-backups:/data/backups
    healthcheck:
      # У образі aspnet немає curl, тож робимо HTTP-запит прямо через bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/v1/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  localmind-db:
  localmind-backups:
