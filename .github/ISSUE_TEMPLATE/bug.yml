name: Баг
description: Щось працює не так, як очікувалось
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Що сталося
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Кроки для відтворення
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Очікуваний результат
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактичний результат
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: ОС
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Коміт або гілка
      placeholder: main @ 8c36a33

  - type: textarea
    id: logs
    attributes:
      label: Логи / текст помилки
      render: text
