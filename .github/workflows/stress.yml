name: Stress (тимчасово, #99)

on:
  push:
    branches: [99-flaky-stress]

permissions:
  contents: read

jobs:
  stress:
    name: stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/LocalMind.Core.Tests --configuration Release
      - name: 10 прогонів поспіль
        shell: bash
        run: |
          for i in $(seq 1 10); do
            echo "=== прогін $i"
            dotnet test tests/LocalMind.Core.Tests --no-build --configuration Release || exit 1
          done
