name: Release

# Тег v* — збірка під 3 ОС і GitHub Release. PR зі зміною цього файла — лише збірка архівів (перевірка без релізу).
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: publish (${{ matrix.rid }})
    # Кожна ОС на своєму раннері: apphost під macOS arm64 має бути підписаний, а це вміє лише macOS.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Застосунок і CLI — окремі папки: в обох свій appsettings.json.
      # Модель у архів не кладемо (~470 МБ): її завантажує scripts/download-models у models/ поруч із програмою.
      - name: Publish
        shell: bash
        run: |
          for project in App Cli; do
            out="dist/LocalMind-$project-${{ matrix.rid }}"
            dotnet publish "src/LocalMind.$project/LocalMind.$project.csproj" --configuration Release \
              --runtime ${{ matrix.rid }} --self-contained true --output "$out"
            # Символи налагодження (SkiaSharp сам по собі ~100 МБ), .lib для лінкування і XML-документація користувачу не потрібні.
            find "$out" -maxdepth 1 \( -name '*.pdb' -o -name '*.lib' -o -name 'LocalMind.*.xml' \) -delete
            mkdir -p "$out/scripts"
            cp scripts/download-models.sh scripts/download-models.ps1 "$out/scripts/"
          done

      - name: Pack (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist -Directory | ForEach-Object {
            Compress-Archive -Path "$($_.FullName)\*" -DestinationPath "dist\$($_.Name).zip"
          }

      # tar.gz зберігає біт виконання для програм і скриптів.
      - name: Pack (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          for dir in */; do
            tar -czf "${dir%/}.tar.gz" -C "$dir" .
          done

      - uses: actions/upload-artifact@v7
        with:
          name: LocalMind-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}" --title "LocalMind ${{ github.ref_name }}" --generate-notes
